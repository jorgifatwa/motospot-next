# RNJ Motospot V2 — Development Docker Compose
# ARCHITECTURE.md Section 13 (development-optimized for Phase 0)
# Hot-reload enabled via volume mounts for next dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: motospot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motospot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motospot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-motospot_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motospot} -d ${POSTGRES_DB:-motospot_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: motospot-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-motospot}:${POSTGRES_PASSWORD:-motospot_dev}@postgres:5432/${POSTGRES_DB:-motospot_dev}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - motospot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  motospot_storage:
